<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Editor</title>
<link rel="icon" href="/assets/images/lt-logo-1-124x121.png">
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --ink: #1d2126;
    --ink-2: #545b64;
    --muted: #8a919a;
    --line: #e3e6ea;
    --line-2: #d3d8de;
    --accent: #1f7f8c;
    --accent-2: #40b0bf;
    --accent-soft: #e6f4f6;
    --danger: #c43c3c;
    --warn: #b7791f;
    --ok: #2f855a;
    --radius: 8px;
    --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 4px 16px rgb(0 0 0 / .06);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
    font-size: 14px;
    color: var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-rows: 56px 1fr; background: var(--bg); overflow: hidden; }
  button, input, textarea, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
  .brand img { width: 28px; height: 28px; border-radius: 6px; }
  .status { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; color: var(--muted); font-size: 13px; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .status.dirty::before { background: var(--warn); }
  .status.busy::before { background: var(--accent-2); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .spacer { flex: 1; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 34px; padding: 0 14px;
    background: var(--panel); border: 1px solid var(--line-2); border-radius: 7px;
    font-weight: 500; cursor: pointer; white-space: nowrap;
    transition: background-color .15s, border-color .15s;
  }
  a.btn { text-decoration: none; color: inherit; }
  .btn:hover { background: #f7f8fa; border-color: #c2c8cf; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn--primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn--primary:hover { background: #196b76; border-color: #196b76; }
  .btn--danger { color: var(--danger); }
  .btn--danger:hover { background: #fdf2f2; border-color: #efc2c2; }
  .btn--ghost { background: transparent; border-color: transparent; }
  .btn--ghost:hover { background: #eef0f3; border-color: transparent; }
  .btn--sm { height: 28px; padding: 0 10px; font-size: 13px; }
  .btn--icon { width: 30px; padding: 0; height: 30px; }
  .kbd { font-size: 11px; color: inherit; opacity: .7; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- Layout ---------- */
  .layout { display: grid; grid-template-columns: 210px minmax(380px, 560px) 1fr; min-height: 0; }
  .layout.no-preview { grid-template-columns: 210px 1fr; }
  .layout.no-preview .preview { display: none; }

  .sidebar { padding: 14px 10px; border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
  .sidebar h2 { margin: 6px 10px 8px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .navbtn {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 10px; margin-bottom: 2px;
    background: none; border: 0; border-radius: 7px; text-align: left; cursor: pointer; color: var(--ink-2);
  }
  .navbtn:hover { background: #f1f3f5; color: var(--ink); }
  .navbtn.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .navbtn .count { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 400; }
  .sidebar .help { margin: 18px 10px 0; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.55; }
  .sidebar .help b { color: var(--ink-2); font-weight: 600; }

  .editor { overflow-y: auto; padding: 22px 24px 80px; border-right: 1px solid var(--line); }
  .layout.no-preview .editor { max-width: 760px; width: 100%; margin: 0 auto; border-right: 0; }
  .panel-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
  .panel-head h1 { margin: 0; font-size: 20px; }
  .panel-head p { margin: 4px 0 0; color: var(--muted); }
  .panel-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .card > h3 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

  /* ---------- Fields ---------- */
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field > label, .field > .label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 13px; color: var(--ink-2); }
  .hint { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .input, .rich {
    width: 100%; padding: 8px 10px;
    background: #fff; border: 1px solid var(--line-2); border-radius: 7px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input.input { height: 36px; }
  textarea.input { resize: vertical; min-height: 70px; line-height: 1.5; }
  .input:focus, .rich:focus-within { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgb(64 176 191 / .18); }
  .input.invalid { border-color: #e0a3a3; }

  .rich { padding: 0; }
  .rich__bar { display: flex; gap: 2px; padding: 4px; border-bottom: 1px solid var(--line); background: #fafbfc; border-radius: 7px 7px 0 0; }
  .rich__bar button { height: 26px; min-width: 28px; padding: 0 7px; background: none; border: 0; border-radius: 5px; cursor: pointer; color: var(--ink-2); }
  .rich__bar button:hover { background: #e9ecef; color: var(--ink); }
  .rich__area { min-height: 80px; padding: 9px 11px; outline: none; line-height: 1.55; }
  .rich__area.block { min-height: 220px; }
  .rich__area p { margin: 0 0 .8em; }
  .rich__area a { color: var(--accent); }

  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .switch input { appearance: none; width: 32px; height: 18px; margin: 0; background: #cfd5db; border-radius: 99px; position: relative; cursor: pointer; transition: background .15s; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { transform: translateX(14px); }

  /* image field */
  .imgfield {
    display: flex; gap: 12px; align-items: center;
    padding: 10px; border: 1.5px dashed var(--line-2); border-radius: var(--radius);
    background: #fafbfc; outline: none; transition: border-color .15s, background .15s;
  }
  .imgfield:focus { border-color: var(--accent-2); background: var(--accent-soft); }
  .imgfield.drag { border-color: var(--accent); background: var(--accent-soft); }
  .imgfield__thumb { width: 132px; height: 84px; flex: none; border-radius: 6px; background: #eceff2 center / cover no-repeat; display: grid; place-items: center; color: var(--muted); font-size: 12px; overflow: hidden; }
  .imgfield__thumb.contain { background-size: contain; background-color: #fff; }
  .imgfield__body { min-width: 0; flex: 1; }
  .imgfield__body p { margin: 0 0 8px; color: var(--ink-2); font-size: 13px; line-height: 1.4; }
  .imgfield__path { margin-top: 6px; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* hero position controls */
  .pos-grid { display: grid; grid-template-columns: 110px 92px 92px 1fr; gap: 8px 10px; align-items: center; }
  .pos-grid .head { font-size: 12px; color: var(--muted); font-weight: 500; }
  .pos-grid .name { font-weight: 500; }
  .num { display: flex; align-items: center; gap: 4px; }
  .num input { width: 64px; }
  .num span { color: var(--muted); font-size: 12px; }
  .seg--align button { padding: 0 8px; }
  .callout { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; margin-bottom: 14px; background: var(--accent-soft); border-radius: 7px; color: #155e67; font-size: 13px; line-height: 1.5; }
  .callout svg { margin-top: 2px; }

  /* color fields */
  .color-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .color-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .color-row:first-of-type { padding-top: 0; }
  .color-row__label { font-weight: 500; color: var(--ink-2); }
  .color-row__label small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .color-ctl { display: flex; align-items: center; gap: 6px; }
  .color-ctl input[type=color] { width: 36px; height: 32px; padding: 2px; border: 1px solid var(--line-2); border-radius: 7px; background: #fff; cursor: pointer; }
  .color-ctl input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .color-ctl input[type=color]::-webkit-color-swatch { border: 0; border-radius: 5px; }
  .color-ctl .input.hex { width: 92px; height: 32px; font: 13px ui-monospace, Menlo, monospace; text-transform: lowercase; }
  .color-ctl .input.hex::placeholder { color: var(--muted); }
  .color-ctl .reset { visibility: hidden; }
  .color-ctl.custom .reset { visibility: visible; }
  .color-note { grid-column: 1 / -1; font-size: 12px; color: var(--warn); }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .swatches button { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgb(0 0 0 / .15); cursor: pointer; padding: 0; }

  /* ---------- News list ---------- */
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
  .toolbar .input { flex: 1; }
  .news-list { display: flex; flex-direction: column; gap: 8px; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); transition: box-shadow .15s, border-color .15s; }
  .item.open { border-color: var(--accent-2); box-shadow: var(--shadow); }
  .item.dragging { opacity: .4; }
  .item.drop-before { box-shadow: 0 -3px 0 var(--accent-2); }
  .item.drop-after { box-shadow: 0 3px 0 var(--accent-2); }
  .item.is-hidden .item__thumb, .item.is-hidden .item__title { opacity: .45; }
  .item__head { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 6px; cursor: pointer; }
  .item__handle { display: grid; place-items: center; width: 20px; height: 32px; color: #b3bac2; cursor: grab; flex: none; }
  .item__handle:active { cursor: grabbing; }
  .item__thumb { width: 64px; height: 40px; flex: none; border-radius: 5px; background: #eceff2 center / cover no-repeat; }
  .item__meta { min-width: 0; flex: 1; }
  .item__title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item__sub { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); overflow: hidden; white-space: nowrap; }
  .item__sub .snippet { overflow: hidden; text-overflow: ellipsis; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 99px; font-size: 11px; font-weight: 500; background: #eef0f3; color: var(--ink-2); flex: none; }
  .badge--warn { background: #fdf3e1; color: var(--warn); }
  .item__tools { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
  .item__head:hover .item__tools, .item.open .item__tools { opacity: 1; }
  .item__chev { transition: transform .2s; color: var(--muted); }
  .item.open .item__chev { transform: rotate(180deg); }
  .item__body { padding: 6px 16px 16px; border-top: 1px solid var(--line); }
  .item__body .field:first-child { margin-top: 12px; }
  .item__actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }

  /* generic list rows */
  .list-row { display: grid; gap: 8px; align-items: center; margin-bottom: 8px; }
  .list-row .tools { display: flex; gap: 2px; }
  .list-head { display: grid; gap: 8px; margin-bottom: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }

  /* ---------- Preview ---------- */
  .preview { display: grid; grid-template-rows: 44px 1fr; min-width: 0; background: #e9ecef; }
  .preview__bar { display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .preview__bar .label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-right: 4px; }
  .seg { display: inline-flex; padding: 2px; background: #eef0f3; border-radius: 7px; }
  .seg button { height: 26px; padding: 0 10px; background: none; border: 0; border-radius: 5px; cursor: pointer; color: var(--ink-2); font-size: 13px; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .1); }
  select.input { width: auto; height: 30px; padding: 0 8px; }
  .preview__stage { position: relative; min-height: 0; display: flex; justify-content: center; overflow: hidden; }
  .preview__stage iframe { position: absolute; top: 0; left: 0; border: 0; background: #fff; transform-origin: 0 0; }
  .preview__stage.mobile iframe { border-radius: 18px; box-shadow: 0 0 0 8px #1d2126, var(--shadow); }
  .preview__tip { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); padding: 6px 12px; border-radius: 99px; background: rgb(29 33 38 / .85); color: #fff; font-size: 12px; pointer-events: none; }

  /* ---------- Modal & toast ---------- */
  .modal-back { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgb(20 24 28 / .45); }
  .modal { width: min(640px, 100%); max-height: 86vh; overflow: auto; background: var(--panel); border-radius: 12px; box-shadow: 0 20px 60px rgb(0 0 0 / .25); }
  .modal header { display: flex; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .modal header h2 { margin: 0; font-size: 16px; }
  .modal .content { padding: 18px; }
  .modal footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .gallery__item { position: relative; }
  .gallery .pick { display: block; width: 100%; padding: 0; border: 2px solid transparent; border-radius: 7px; background: #eceff2; cursor: pointer; overflow: hidden; }
  .gallery .pick:hover { border-color: var(--accent-2); }
  .gallery .del { position: absolute; top: 5px; right: 5px; display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 6px; background: rgb(255 255 255 / .92); color: #b42318; cursor: pointer; opacity: 0; box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: opacity .15s; }
  .gallery .del svg { width: 15px; height: 15px; }
  .gallery__item:hover .del, .gallery .del:focus-visible { opacity: 1; }
  .gallery .del:hover { background: #b42318; color: #fff; }
  @media (hover: none) { .gallery .del { opacity: 1; } }
  .gallery img { display: block; width: 100%; height: 86px; object-fit: cover; }
  .gallery span { display: block; padding: 4px 6px; font-size: 11px; color: var(--ink-2); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: #fff; }
  pre.log { max-height: 240px; overflow: auto; padding: 10px; background: #1d2126; color: #e6e6e6; border-radius: 7px; font-size: 12px; white-space: pre-wrap; }
  .changes { margin: 8px 0 14px; padding: 8px 10px; max-height: 150px; overflow: auto; background: #f7f8fa; border: 1px solid var(--line); border-radius: 7px; font: 12px ui-monospace, Menlo, monospace; }

  .toasts { position: fixed; left: 50%; bottom: 20px; z-index: 60; display: flex; flex-direction: column; gap: 8px; transform: translateX(-50%); }
  .toast { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #1d2126; color: #fff; border-radius: 8px; box-shadow: var(--shadow); animation: rise .2s ease-out; }
  .toast.error { background: var(--danger); }
  .toast button { background: none; border: 0; color: var(--accent-2); font-weight: 600; cursor: pointer; padding: 0; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } }

  /* Images panel */
  .imgbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .imgbar .input { flex: 1 1 160px; min-width: 0; }
  .imgbar select { height: 30px; }
  .imgsel { position: sticky; top: -1px; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; margin-bottom: 10px; background: var(--accent-soft); border-radius: 8px; font-size: 13px; }
  .imgsel .spacer { flex: 1; }
  .imgdrop { padding: 14px; margin-bottom: 12px; border: 2px dashed var(--line); border-radius: var(--radius); text-align: center; color: var(--muted); font-size: 13px; }
  .imgdrop.drag { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .imglist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); overflow: hidden; }
  .imgrow { display: grid; grid-template-columns: 22px 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line); }
  .imgrow:first-child { border-top: 0; }
  .imgrow.sel { background: var(--accent-soft); }
  .imgrow input[type=checkbox] { width: 16px; height: 16px; margin: 0; cursor: pointer; }
  .imgrow__thumb { width: 64px; height: 48px; border-radius: 5px; background: #eceff2 center / contain no-repeat; cursor: zoom-in; border: 0; padding: 0; }
  .imgrow__name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .imgrow__meta { margin-top: 2px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .imgrow__actions { display: flex; gap: 2px; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 500; }
  .badge--used { background: #e7f4ee; color: #146c43; cursor: help; }
  .badge--unused { background: #f1f3f5; color: var(--muted); }
  .imgpreview img { display: block; max-width: 100%; max-height: 70vh; margin: 0 auto; }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
  .loading { display: grid; place-items: center; height: 100%; color: var(--muted); }

  @media (max-width: 1100px) {
    .layout { grid-template-columns: 180px 1fr; }
    .layout .preview { display: none; }
    .layout.show-preview { grid-template-columns: 180px 1fr 1fr; }
    .layout.show-preview .preview { display: grid; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="/assets/images/lt-logo-1-124x121.png" alt="">Website Editor</div>
    <span class="status" id="status">Loading…</span>
    <div class="spacer"></div>
    <button class="btn btn--ghost btn--icon" id="undo" title="Undo (⌘Z)" disabled><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="btn btn--ghost btn--icon" id="redo" title="Redo (⇧⌘Z)" disabled><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="btn btn--ghost" id="togglePreview" title="Show/hide preview"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M13 4v16"/></svg>Preview</button>
    <a class="btn btn--ghost" href="/index.html" target="_blank" title="Open the saved site in a new tab"><svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>Open site</a>
    <button class="btn" id="discard" disabled>Discard changes</button>
    <button class="btn btn--primary" id="save" disabled>Save <span class="kbd">⌘S</span></button>
    <button class="btn" id="publish"><svg class="i" viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m6 10 6-6 6 6"/><path d="M4 20h16"/></svg>Publish…</button>
  </header>

  <div class="layout" id="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="editor" id="editor"><div class="loading">Loading content…</div></main>
    <section class="preview">
      <div class="preview__bar">
        <span class="label">Preview</span>
        <select class="input" id="previewPage" aria-label="Page to preview"></select>
        <div class="spacer"></div>
        <div class="seg" role="group" aria-label="Device">
          <button class="on" data-device="desktop">Desktop</button>
          <button data-device="mobile">Mobile</button>
        </div>
      </div>
      <div class="preview__stage" id="stage">
        <iframe id="frame" title="Live preview"></iframe>
        <div class="preview__tip" id="tip">Click anything in the preview to edit it</div>
      </div>
    </section>
  </div>

  <div class="toasts" id="toasts"></div>

<script>
/* =====================================================================
   State
   ===================================================================== */
const S = {
  content: null,
  savedJSON: "",
  panel: localStorage.getItem("editor.panel") || "news",
  openItem: null,     // index of expanded news item
  filter: "",
  history: [],        // JSON snapshots for undo
  future: [],
  lastSnapshot: "",
  previewPage: "index.html",
  images: null,
  imageDetails: null, // [{path, name, size, mtime, usedIn}] for the Images panel

function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k in el && typeof v !== "string") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(c));
  }
  return el;
}

async function api(path, { method = "GET", body, headers = {} } = {}) {
  const opts = { method, headers };
  if (body !== undefined && !(body instanceof Blob)) {
    opts.body = JSON.stringify(body);
    opts.headers["Content-Type"] = "application/json";
  } else if (body) opts.body = body;
  const res = await fetch(path, opts);
  const type = res.headers.get("Content-Type") || "";
  const data = type.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(data.error || data || res.statusText);
  return data;
}

/* =====================================================================
   Change tracking, undo, save
   ===================================================================== */
let snapshotTimer, previewTimer;

function changed({ structural = false, skipPreview = false } = {}) {
  updateStatus();
  if (!skipPreview) schedulePreview();
  clearTimeout(snapshotTimer);
  if (structural) snapshot();
  else snapshotTimer = setTimeout(snapshot, 700);
}

function snapshot() {
  const json = JSON.stringify(S.content);
  if (json === S.lastSnapshot) return;
  S.history.push(S.lastSnapshot);
  if (S.history.length > 200) S.history.shift();
  S.future = [];
  S.lastSnapshot = json;
  updateStatus();
}

function restore(json) {
  S.content = JSON.parse(json);
  S.lastSnapshot = json;
  renderAll();
  schedulePreview(0);
}

function undo() {
  clearTimeout(snapshotTimer); snapshot();
  if (!S.history.length) return;
  S.future.push(S.lastSnapshot);
  restore(S.history.pop());
}
function redo() {
  if (!S.future.length) return;
  S.history.push(S.lastSnapshot);
  restore(S.future.pop());
}

const isDirty = () => S.content && JSON.stringify(S.content) !== S.savedJSON;

function updateStatus(text) {
  const st = $("#status");
  const dirty = isDirty();
  st.className = "status" + (text ? " busy" : dirty ? " dirty" : "");
  st.textContent = text || (dirty ? "Unsaved changes" : "All changes saved");
  $("#save").disabled = !dirty;
  $("#discard").disabled = !dirty;
  $("#undo").disabled = !S.history.length && JSON.stringify(S.content) === S.lastSnapshot;
  $("#redo").disabled = !S.future.length;
  const count = $("#count-news");
  if (count) count.textContent = S.content.news.items.length;
}

// Copy sanitized values from the server back into the live objects, so the
// field components (which hold references to them) keep working.
function mergeInPlace(target, source) {
  for (const key of Object.keys(source)) {
    const s = source[key], t = target[key];
    if (s && typeof s === "object" && t && typeof t === "object" && Array.isArray(s) === Array.isArray(t)) mergeInPlace(t, s);
    else target[key] = s;
  }
}

async function save() {
  if (!isDirty()) return;
  clearTimeout(snapshotTimer); snapshot();
  updateStatus("Saving…");
  try {
    const res = await api("/api/save", { method: "POST", body: { content: S.content } });
    mergeInPlace(S.content, res.content);
    S.savedJSON = S.lastSnapshot = JSON.stringify(S.content);
    updateStatus();
    toast(`Saved — ${res.written.join(", ")} updated`);
  } catch (e) {
    updateStatus();
    toast("Save failed: " + e.message, { error: true, ms: 8000 });
  }
}

async function discard() {
  if (!confirm("Discard all unsaved changes?")) return;
  S.history.push(S.lastSnapshot);
  restore(S.savedJSON);
  updateStatus();
}

function rich(obj, key, { block = false, oninput } = {}) {
  const area = h("div", { class: "rich__area" + (block ? " block" : ""), contenteditable: "true", spellcheck: "true" });
  area.innerHTML = obj[key] || "";

  area.addEventListener("input", sync);
  area.addEventListener("focus", () => document.execCommand("defaultParagraphSeparator", false, block ? "p" : "div"));
  area.addEventListener("paste", (e) => {
    // Paste as plain text so formatting from Word/web pages doesn't leak in.
    const t = e.clipboardData.getData("text/plain");
    if (!t) return;
    e.preventDefault();
    document.execCommand("insertText", false, t);
  });
  const cmd = (name, arg) => (e) => { e.preventDefault(); area.focus(); document.execCommand(name, false, arg); sync(); };
  const addLink = (e) => {
    e.preventDefault();
    const sel = window.getSelection();
    const range = sel.rangeCount && area.contains(sel.anchorNode) ? sel.getRangeAt(0).cloneRange() : null;
    const url = prompt("Link address (https://…, mailto:…, or a page like page1.html)", "https://");
    if (!url || url === "https://") return;
    area.focus();
    if (range) { sel.removeAllRanges(); sel.addRange(range); }
    if (!range || range.collapsed) document.execCommand("insertHTML", false, `<a href="${url.replace(/"/g, "&quot;")}">${url.replace(/</g, "&lt;")}</a>`);
    else document.execCommand("createLink", false, url);

    h("button", { type: "button", title: "Bold (⌘B)", onmousedown: cmd("bold") }, h("b", {}, "B")),
    h("button", { type: "button", title: "Italic (⌘I)", onmousedown: cmd("italic") }, h("i", {}, "I")),
    h("button", { type: "button", title: "Add link", onmousedown: addLink }, svg(ICON.link), " Link"),

  );
  return h("div", { class: "rich" }, bar, area);
}

async function uploadFile(file) {
  if (!file.type.startsWith("image/")) throw new Error("That file isn't an image.");
  let name = file.name && file.name !== "image.png" ? file.name : `pasted-${Date.now()}.${(file.type.split("/")[1] || "png").replace("jpeg", "jpg")}`;
  updateStatus("Uploading image…");
  try {
    const res = await api("/api/upload", { method: "POST", body: file, headers: { "X-Filename": encodeURIComponent(name).replace(/%/g, "_") } });
    S.images = null;
    S.imageDetails = null;
    return res.path;
  } finally { updateStatus(); }
}

function imageField(obj, key, { contain = false, onchange } = {}) {
  const thumb = h("div", { class: "imgfield__thumb" + (contain ? " contain" : "") });

  const set = (v) => { obj[key] = v; paint(); onchange?.(); changed({ structural: true }); };
  const handleFiles = async (files) => {
    const file = [...files].find((f) => f.type.startsWith("image/"));
    if (!file) return toast("No image found — try a PNG, JPG or WebP.", { error: true });
    try { set(await uploadFile(file)); toast("Image uploaded"); }
    catch (e) { toast("Upload failed: " + e.message, { error: true }); }
  };
  const fileInput = h("input", { type: "file", accept: "image/*", hidden: true, onchange: (e) => handleFiles(e.target.files) });

  const wrap = h("div", { class: "imgfield", tabindex: "0", title: "Click here, then paste a screenshot with ⌘V" },
    thumb,
    h("div", { class: "imgfield__body" },

        h("button", { class: "btn btn--sm", type: "button", onclick: () => fileInput.click() }, svg(ICON.upload), "Upload…"),
        h("button", { class: "btn btn--sm", type: "button", onclick: () => pickImage(set) }, svg(ICON.image), "Choose existing…"),
        obj[key] && h("button", { class: "btn btn--sm btn--ghost btn--danger", type: "button", onclick: (e) => { set(""); e.target.closest("button").remove(); } }, "Remove"),
      ),
      pathEl, fileInput,
    ),
  );
  wrap.addEventListener("paste", (e) => {
    if (e.clipboardData.files.length) { e.preventDefault(); handleFiles(e.clipboardData.files); }
  });
  wrap.addEventListener("dragover", (e) => { e.preventDefault(); wrap.classList.add("drag"); });

  wrap.addEventListener("drop", (e) => {
    e.preventDefault(); wrap.classList.remove("drag");

  });
  paint();
  return wrap;
}

/* Permanently delete an image file. The server refuses while anything uses it. */
async function deleteImage(p, repaint) {
  const name = p.split("/").pop();
  if (!confirm(`Delete “${name}” from assets/images?\n\nThe file is removed from disk. If it was committed to git, it can only be recovered from git history.`)) return;
  try {
    const res = await api("/api/delete-images", { method: "POST", body: { paths: [p], content: S.content } });
    if (res.blocked.length) {
      alert(`“${name}” is still in use, so it was not deleted:\n\n• ${res.blocked[0].usedIn.join("\n• ")}\n\nRemove it from those places (and Save) first.`);
      return;
    }
    if (res.errors.length) throw new Error(res.errors[0].error);
    S.images = S.images.filter((x) => x !== p);
    S.imageDetails = null;
    repaint();
    toast(`Deleted “${name}”`);
  } catch (err) {
    alert(`Could not delete “${name}”: ${err.message}`);
  }
}

        thumbEl.style.backgroundImage = item.image ? `url("/${item.image}")` : "";
        const missing = [!item.image && "image", !item.link && "link", !item.date && "date"].filter(Boolean);
        warnEl.replaceChildren(
          ...(item.hidden ? [h("span", { class: "badge" }, "Hidden")] : []),
          ...(missing.length ? [h("span", { class: "badge badge--warn", title: "Optional, but usually wanted" }, "No " + missing.join(", "))] : []));
      };
      paintHead();

      const remove = () => {
        news.items.splice(i, 1);
        if (S.openItem === i) S.openItem = null; else if (S.openItem > i) S.openItem--;
        changed({ structural: true });
        renderPanel();
        toast(`Deleted “${item.title}”`, { action: "Undo", onAction: undo, ms: 6000 });
      };
      const moveTo = (to) => {
        if (to < 0 || to >= news.items.length) return;
        move(news.items, i, to);
        if (S.openItem === i) S.openItem = to;
        changed({ structural: true });
        renderPanel();
      };
      const stop = (fn) => (e) => { e.stopPropagation(); fn(); };

      const head = h("div", { class: "item__head", onclick: () => { S.openItem = open ? null : i; renderPanel(); if (!open) focusPreviewCard(i); } },
        h("div", { class: "item__handle", title: "Drag to reorder", draggable: "true" }, svg(ICON.grip)),
        thumbEl,
        h("div", { class: "item__meta" }, titleEl, h("div", { class: "item__sub" }, dateEl, warnEl, snippetEl)),
        h("div", { class: "item__tools" },
          h("button", { class: "btn btn--ghost btn--icon", title: "Move up", disabled: i === 0, onclick: stop(() => moveTo(i - 1)) }, svg(ICON.up)),
          h("button", { class: "btn btn--ghost btn--icon", title: "Move down", disabled: i === news.items.length - 1, onclick: stop(() => moveTo(i + 1)) }, svg(ICON.down)),
        ),
        svg(ICON.chev, "i item__chev"),
      );

      const el = h("div", { class: "item" + (open ? " open" : "") + (item.hidden ? " is-hidden" : ""), "data-index": i }, head);

      // drag & drop reordering (from the grip handle)
      const handle = head.querySelector(".item__handle");
      handle.addEventListener("click", (e) => e.stopPropagation());
      handle.addEventListener("dragstart", (e) => { dragFrom = i; el.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setDragImage(el, 20, 20); });
      handle.addEventListener("dragend", () => { dragFrom = null; el.classList.remove("dragging"); });
      el.addEventListener("dragover", (e) => {
        if (dragFrom === null) return;
        e.preventDefault();
        const after = e.offsetY > el.offsetHeight / 2;
        el.classList.toggle("drop-after", after); el.classList.toggle("drop-before", !after);
      });
      el.addEventListener("dragleave", () => el.classList.remove("drop-after", "drop-before"));
      el.addEventListener("drop", (e) => {
        if (dragFrom === null) return;
        e.preventDefault();
        const after = el.classList.contains("drop-after");
        el.classList.remove("drop-after", "drop-before");
        let to = i + (after ? 1 : 0);
        if (dragFrom < to) to--;
        const from = dragFrom; dragFrom = null;
        if (from === to) return;
        const openObj = news.items[S.openItem];
        move(news.items, from, to);
        S.openItem = openObj ? news.items.indexOf(openObj) : null;
        changed({ structural: true });
        renderPanel();
      });

      if (open) {
        el.append(h("div", { class: "item__body" },
          h("div", { class: "row" },
            field("Title", text(item, "title", { list: "title-suggestions", oninput: paintHead })),
            field("Date", dateInput(item, "date", paintHead))),
          field("Image", imageField(item, "image", { onchange: paintHead })),
          field("Description", rich(item, "text", { oninput: paintHead })),
          field("“Learn more” link", text(item, "link", { placeholder: "https://arxiv.org/abs/…", type: "url", oninput: paintHead }),
            "Leave empty to hide the button."),
          h("div", { class: "item__actions" },
            toggle(item, "hidden", "Show on website", { invert: true, onchange: () => { paintHead(); el.classList.toggle("is-hidden", !!item.hidden); } }),
            h("div", { class: "spacer" }),
            i > 0 && h("button", { class: "btn btn--sm", onclick: () => moveTo(0) }, svg(ICON.top), "Move to top"),
            h("button", { class: "btn btn--sm", onclick: () => {
              news.items.splice(i, 0, structuredClone(item)); S.openItem = i; changed({ structural: true }); renderPanel();
            } }, svg(ICON.copy), "Duplicate"),
            h("button", { class: "btn btn--sm btn--danger", onclick: remove }, svg(ICON.trash), "Delete"),
          ),
        ));
      }
      return el;
    };

    paintList();
    return [
      panelHead("What's new", `${news.items.length} items · shown newest first in the carousel`,
        h("button", { class: "btn btn--primary", onclick: addItem }, svg(ICON.plus), "Add news item")),
      h("div", { class: "toolbar" }, search,
        h("button", { class: "btn", title: "Sort all items by date, newest first", onclick: sortByDate }, svg(ICON.sort), "Sort by date")),
      list, datalist,
      h("div", { class: "card", style: { marginTop: "18px" } },
        h("h3", {}, "Section settings"),
        h("div", { class: "row" },
          field("Section title", text(news, "title")),
          field("Auto-advance (seconds)", text(news, "autoplaySeconds", { type: "number" }), "0 turns auto-advance off."))),
    ];
  },

  images() {
    if (!S.imageDetails) {
      if (!S.imgLoading) {
        S.imgLoading = true;
        api("/api/images/details").then((d) => { S.imageDetails = d; if (S.panel === "images") renderAll(); })
          .catch((e) => toast("Could not load images: " + e.message, { error: true }))
          .finally(() => { S.imgLoading = false; });
      }
      return [panelHead("Images", "Every file in assets/images."), h("div", { class: "empty" }, "Loading images…")];
    }
    const V = S.imgView;
    const draft = JSON.stringify(S.content);
    // Where each image is used: saved website files (from the server) plus the
    // editor's unsaved draft. Matches what the server checks before deleting.
    const usage = (img) => draft.includes(img.path) && !img.usedIn.includes("_editor/content.json")
      ? ["unsaved editor changes", ...img.usedIn] : img.usedIn;
    for (const p of [...S.imgSel]) if (!S.imageDetails.some((i) => i.path === p)) S.imgSel.delete(p);

    const q = V.q.toLowerCase();
    let items = S.imageDetails.map((i) => ({ ...i, uses: usage(i) }))
      .filter((i) => i.name.toLowerCase().includes(q))
      .filter((i) => V.show === "all" || (V.show === "unused") === (i.uses.length === 0));
    const by = { new: (a, b) => b.mtime - a.mtime, old: (a, b) => a.mtime - b.mtime,
                 name: (a, b) => a.name.localeCompare(b.name), size: (a, b) => b.size - a.size };
    items.sort(by[V.sort]);

    const reload = () => { S.imageDetails = null; S.images = null; renderAll(); };
    const repaint = () => renderPanel();

    // ---- upload (button, drop, paste)
    const upload = async (files) => {
      const imgs = [...files].filter((f) => f.type.startsWith("image/"));
      if (!imgs.length) return toast("No images found — try PNG, JPG, WebP, GIF or SVG.", { error: true });
      let ok = 0;
      for (const f of imgs) {
        try { await uploadFile(f); ok++; } catch (e) { toast(`${f.name}: ${e.message}`, { error: true }); }
      }
      if (ok) toast(`Uploaded ${ok} image${ok > 1 ? "s" : ""}`);
      reload();
    };
    const fileInput = h("input", { type: "file", accept: "image/*", multiple: true, hidden: true, onchange: (e) => upload(e.target.files) });
    const drop = h("div", { class: "imgdrop", tabindex: "0" }, "Drop images here, or click here and paste a screenshot (⌘V)");
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
    drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("drag"); upload(e.dataTransfer.files); });
    drop.addEventListener("paste", (e) => { if (e.clipboardData.files.length) { e.preventDefault(); upload(e.clipboardData.files); } });

    // ---- delete
    const remove = async (paths) => {
      const unused = paths.filter((p) => !usage(S.imageDetails.find((i) => i.path === p)).length);
      const inUse = paths.length - unused.length;
      if (!unused.length) return alert("All selected images are in use, so none can be deleted. Remove them from the site (and Save) first.");
      const names = unused.map((p) => "• " + p.split("/").pop());
      const list = names.length > 12 ? [...names.slice(0, 12), `…and ${names.length - 12} more`] : names;
      if (!confirm(`Delete ${unused.length} image file${unused.length > 1 ? "s" : ""}?` +
        (inUse ? ` (${inUse} in-use image${inUse > 1 ? "s" : ""} will be skipped.)` : "") +
        `\n\n${list.join("\n")}\n\nFiles are removed from disk. Committed files can only be recovered from git history.`)) return;
      try {
        const res = await api("/api/delete-images", { method: "POST", body: { paths: unused, content: S.content } });
        res.deleted.forEach((p) => S.imgSel.delete(p));
        const msg = [`Deleted ${res.deleted.length}`];
        if (res.blocked.length) msg.push(`${res.blocked.length} in use, skipped`);
        if (res.errors.length) msg.push(`${res.errors.length} failed`);
        toast(msg.join(" · "), { error: !!(res.blocked.length || res.errors.length) });
      } catch (e) { toast("Delete failed: " + e.message, { error: true }); }
      reload();
    };

    // ---- rename
    const rename = async (img) => {
      const stem = img.name.replace(/\.[^.]+$/, "");
      const next = prompt(`Rename “${img.name}” to (extension is kept):`, stem);
      if (next == null || next.trim() === "" || next.trim() === stem) return;
      if (isDirty() && !confirm("Renaming saves the new file name into the website files. Your other unsaved changes stay unsaved. Continue?")) return;
      try {
        const res = await api("/api/rename-image", { method: "POST", body: { path: img.path, newName: next } });
        if (res.ok === false) return alert(`“${img.name}” is used in files the editor can't update, so it was not renamed:\n\n• ${res.usedIn.join("\n• ")}`);
        if (res.unchanged) return;
        // keep the draft and the "saved" baseline in step with the server
        const swap = (json) => json.split(JSON.stringify(res.old).slice(1, -1)).join(JSON.stringify(res.path).slice(1, -1));
        S.content = JSON.parse(swap(JSON.stringify(S.content)));
        S.savedJSON = swap(S.savedJSON);
        S.lastSnapshot = JSON.stringify(S.content);
        if (S.imgSel.delete(res.old)) S.imgSel.add(res.path);
        toast(`Renamed to ${res.path.split("/").pop()}`);
        changed({ structural: true });
      } catch (e) { toast("Rename failed: " + e.message, { error: true }); }
      reload();
    };

    const preview = (img) => {
      const close = () => back.remove();
      const back = h("div", { class: "modal-back", onclick: (e) => e.target === back && close() },
        h("div", { class: "modal" },
          h("header", {}, h("h2", {}, img.name), h("div", { class: "spacer" }), h("button", { class: "btn btn--ghost", onclick: close }, "Close")),
          h("div", { class: "content imgpreview" }, h("img", { src: "/" + img.path + "?t=" + img.mtime, alt: "" }))));
      document.body.append(back);
    };
    const copyPath = async (img) => {
      try { await navigator.clipboard.writeText(img.path); toast("Path copied"); }
      catch { prompt("Copy the path:", img.path); }
    };

    // ---- rows
    const toggle = (img, on, shift) => {
      const a = items.findIndex((i) => i.path === S.imgLast);
      if (shift && a >= 0) {
        const b = items.findIndex((i) => i.path === img.path);
        items.slice(Math.min(a, b), Math.max(a, b) + 1).forEach((i) => on ? S.imgSel.add(i.path) : S.imgSel.delete(i.path));
      } else on ? S.imgSel.add(img.path) : S.imgSel.delete(img.path);
      S.imgLast = img.path;
      repaint();
    };
    const fmtSize = (n) => n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(0)} KB` : `${(n / 1048576).toFixed(1)} MB`;
    const fmtDate = (t) => new Date(t * 1000).toISOString().slice(0, 10);
    const rows = items.map((img) => {
      const key = img.path + img.mtime;
      const dims = h("span", {}, S.imgDims[key] || "");
      if (!S.imgDims[key]) {
        const probe = new Image();
        probe.onload = () => { if (probe.naturalWidth) dims.textContent = S.imgDims[key] = `${probe.naturalWidth}×${probe.naturalHeight}`; };
        probe.src = "/" + img.path + "?t=" + img.mtime;
      }
      const sel = S.imgSel.has(img.path);
      return h("div", { class: "imgrow" + (sel ? " sel" : "") },
        h("input", { type: "checkbox", checked: sel, "aria-label": `Select ${img.name}`,
          onclick: (e) => toggle(img, e.target.checked, e.shiftKey) }),
        h("button", { class: "imgrow__thumb", type: "button", title: "Preview", style: { backgroundImage: `url("/${img.path}?t=${img.mtime}")` }, onclick: () => preview(img) }),
        h("div", { style: { minWidth: 0 } },
          h("div", { class: "imgrow__name", title: img.path }, img.name),
          h("div", { class: "imgrow__meta" },
            img.uses.length
              ? h("span", { class: "badge badge--used", title: "Used in:\n" + img.uses.join("\n") }, `Used · ${img.uses.length}`)
              : h("span", { class: "badge badge--unused" }, "Unused"),
            dims, h("span", {}, fmtSize(img.size)), h("span", {}, fmtDate(img.mtime)))),
        h("div", { class: "imgrow__actions" },
          h("button", { class: "btn btn--ghost btn--icon", title: "Copy path", onclick: () => copyPath(img) }, svg(ICON.copy)),
          h("button", { class: "btn btn--ghost btn--icon", title: "Rename", onclick: () => rename(img) }, "✎"),
          h("button", { class: "btn btn--ghost btn--icon btn--danger", title: img.uses.length ? "In use — can't delete" : "Delete",
            disabled: img.uses.length > 0, onclick: () => remove([img.path]) }, svg(ICON.trash))));
    });

    // ---- toolbar + selection bar
    const search = h("input", { class: "input", placeholder: "Filter by file name…", value: V.q });
    search.addEventListener("input", () => { V.q = search.value; repaint(); setTimeout(() => { const el = $(".imgbar .input"); el?.focus(); el?.setSelectionRange(V.q.length, V.q.length); }); });
    const seg = (key, opts) => h("div", { class: "seg" }, opts.map(([v, label]) =>
      h("button", { class: V[key] === v ? "on" : "", type: "button", onclick: () => { V[key] = v; repaint(); } }, label)));
    const sortSel = h("select", { class: "input", style: { flex: "0 0 auto", width: "auto" }, onchange: (e) => { V.sort = e.target.value; repaint(); } },
      [["new", "Newest"], ["old", "Oldest"], ["name", "Name"], ["size", "Largest"]].map(([v, l]) => h("option", { value: v, selected: V.sort === v }, l)));

    const visible = items.map((i) => i.path);
    const allOn = visible.length > 0 && visible.every((p) => S.imgSel.has(p));
    const selected = [...S.imgSel];
    const selUnused = selected.filter((p) => { const i = S.imageDetails.find((x) => x.path === p); return i && !usage(i).length; });
    const unusedCount = S.imageDetails.filter((i) => !usage(i).length).length;

    const selbar = h("div", { class: "imgsel" },
      h("label", { style: { display: "flex", gap: "6px", alignItems: "center", cursor: "pointer" } },
        h("input", { type: "checkbox", checked: allOn, onclick: () => { visible.forEach((p) => allOn ? S.imgSel.delete(p) : S.imgSel.add(p)); repaint(); } }),
        selected.length ? `${selected.length} selected` : "Select all shown"),
      h("div", { class: "spacer" }),
      selected.length > 0 && h("button", { class: "btn btn--sm btn--ghost", onclick: () => { S.imgSel.clear(); repaint(); } }, "Clear"),
      h("button", { class: "btn btn--sm btn--danger", disabled: !selUnused.length, onclick: () => remove(selected),
        title: selected.length && !selUnused.length ? "All selected images are in use" : "" },
        svg(ICON.trash), selected.length ? `Delete ${selUnused.length}${selUnused.length < selected.length ? ` (${selected.length - selUnused.length} in use)` : ""}` : "Delete"));

    return [
      panelHead("Images", `${S.imageDetails.length} files in assets/images · ${unusedCount} unused`,
        h("button", { class: "btn", title: "Reload the list from disk", onclick: reload }, "Refresh"),

/* =====================================================================
   Colors
   ===================================================================== */
let META = { themeDefaults: {} };
let colorUpdaters = [];   // refresh contrast notes when a related color changes
const HEX = /^#[0-9a-f]{6}$/i;
const PALETTE = ["#232323", "#ffffff", "#fafafa", "#40b0bf", "#1f7f8c", "#0a66c2", "#e0a800", "#e4572e", "#7b61ff", "#2f855a"];
const BRAND_COLORS = { x: "#000000", linkedin: "#0a66c2", youtube: "#ff0000" };
const DERIVED = { "nav-link-hover": "accent", "social-hover": "accent", "hero-line": "hero-name" };

const theme = () => (S.content.theme ??= {});
function effectiveColor(key) {
  return theme()[key] || (DERIVED[key] ? effectiveColor(DERIVED[key]) : META.themeDefaults[key]);
}

function luminance(hex) {
  const [r, g, b] = [1, 3, 5].map((i) => {
    const c = parseInt(hex.slice(i, i + 2), 16) / 255;
    return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function contrast(a, b) {
  const [l1, l2] = [luminance(a), luminance(b)].sort((x, y) => y - x);
  return (l1 + 0.05) / (l2 + 0.05);
}

// Instant preview while dragging a color picker (no re-render).
function applyColorsToPreview() {
  const doc = frame.contentDocument;
  if (!doc?.documentElement) return;
  const root = doc.documentElement.style;
  for (const key of Object.keys(META.themeDefaults)) {
    if (theme()[key]) root.setProperty("--" + key, theme()[key]);
  }
  doc.querySelectorAll(".nav__social a").forEach((a, i) => {
    const c = S.content.social[i]?.color;
    if (c) a.style.setProperty("--icon-color", c);
  });
}

/* A color picker + hex box + reset. `get`/`set` let it bind to theme keys or
   to per-icon colors; `bg` (a function) enables the readability warning. */
function colorControl({ get, set, fallback, bg, compact = false }) {
  const picker = h("input", { type: "color", title: "Pick a color" });
  const hex = h("input", { class: "input hex", maxlength: "7", spellcheck: "false", hidden: compact });
  const ctl = h("div", { class: "color-ctl" }, picker, hex);
  const note = h("div", { class: "color-note", hidden: true });
  const reset = h("button", { class: "btn btn--ghost btn--icon reset", title: "Reset to default", type: "button" }, svg('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>'));
  ctl.append(reset);

  const paint = () => {
    const value = get();
    const shown = value || fallback();
    picker.value = shown;
    if (document.activeElement !== hex) hex.value = value || "";
    hex.placeholder = fallback();
    ctl.classList.toggle("custom", !!value);
    if (bg) {
      const ratio = contrast(shown, bg.value());
      // Only warn about choices the user made, not the site's defaults.
      note.hidden = ratio >= 3 || !(value || bg.custom());
      note.textContent = `Hard to read on this background (contrast ${ratio.toFixed(1)}:1)`;
    }
  };
  const update = (v, { live = true } = {}) => {
    set(v);
    paint();
    colorUpdaters.forEach((fn) => fn !== paint && fn());
    if (live && v) { applyColorsToPreview(); changed({ skipPreview: true }); }
    else changed({ structural: true });
  };
  picker.addEventListener("input", () => update(picker.value));
  picker.addEventListener("change", () => { clearTimeout(snapshotTimer); snapshot(); });
  hex.addEventListener("input", () => {
    let v = hex.value.trim();
    if (v && !v.startsWith("#")) v = "#" + v;
    if (HEX.test(v)) update(v.toLowerCase());
    else if (!v) update("", { live: false });
  });
  hex.addEventListener("blur", paint);
  reset.addEventListener("click", () => update("", { live: false }));
  colorUpdaters.push(paint);
  paint();
  return { ctl, note };
}

function colorRow(key, label, { hint, bg } = {}) {
  const { ctl, note } = colorControl({
    get: () => theme()[key] || "",
    set: (v) => { if (v) theme()[key] = v; else delete theme()[key]; },
    fallback: () => (DERIVED[key] ? effectiveColor(DERIVED[key]) : META.themeDefaults[key]),
    bg: bg && {
      value: () => (bg.startsWith("#") ? bg : effectiveColor(bg)),
      custom: () => !bg.startsWith("#") && !!theme()[bg],
    },
  });
  return h("div", { class: "color-row" },
    h("div", { class: "color-row__label" }, label, hint && h("small", {}, hint)), ctl, note);
}

function setBrandColors(on) {
  for (const item of S.content.social) {
    if (on && BRAND_COLORS[item.icon]) item.color = BRAND_COLORS[item.icon];
    else delete item.color;
  }
  changed({ structural: true });
  renderPanel();
}

/* =====================================================================
   Hero text positions
   ===================================================================== */
const HERO_OBJECTS = [["name", "Name"], ["tagline", "Tagline"], ["credit", "Image credit"]];
const ALIGN_FRACTION = { left: 0, center: 0.5, right: 1 };
const round1 = (n) => Math.round(n * 10) / 10;
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

function previewHero() {
  const doc = frame.contentDocument;
  const hero = doc?.querySelector(".hero");
  if (!hero || S.previewPage !== "index.html") return null;
  return { doc, hero };
}

// Read where the text currently sits in the preview, as percentages of the banner.
function measureHero() {
  const p = previewHero();
  if (!p) return null;
  const hb = p.hero.getBoundingClientRect();
  const defaults = { name: "left", tagline: "left", credit: "right" };
  const out = {};
  p.doc.querySelectorAll(".hero__obj").forEach((el) => {
    const key = el.dataset.obj;
    const existing = S.content.hero.positions?.[key];
    if (existing) { out[key] = { ...existing }; return; }
    const range = p.doc.createRange();
    range.selectNodeContents(el);
    const text = range.getBoundingClientRect(), box = el.getBoundingClientRect();
    const align = defaults[key] || "left";
    const anchor = align === "right" ? text.right : align === "center" ? (text.left + text.right) / 2 : text.left;
    out[key] = {
      x: round1((anchor - hb.left) / hb.width * 100),
      y: round1((box.top + box.height / 2 - hb.top) / hb.height * 100),
      align,
    };
  });
  return out;
}

// Apply positions to the preview DOM directly (no re-render), mirroring build.py.
function applyHeroPositions(positions) {
  const p = previewHero();
  if (!p) return;
  p.hero.classList.add("hero--free");
  p.doc.querySelectorAll(".hero__obj").forEach((el) => {
    const pos = positions[el.dataset.obj];
    if (!pos) return;
    el.style.setProperty("--x", pos.x + "%");
    el.style.setProperty("--y", pos.y + "%");
    el.dataset.align = pos.align;
  });
}

function customizeHero() {
  if (S.previewPage !== "index.html") setPreviewPage("index.html");
  const positions = measureHero();
  if (!positions) return toast("Wait for the preview to load, then try again.", { error: true });
  S.content.hero.positions = positions;
  changed({ structural: true });
  if (S.panel === "hero") renderPanel();
}

function setHeroAlign(key, align) {
  const pos = S.content.hero.positions[key];
  const p = previewHero();
  const el = p?.doc.querySelector(`.hero__obj[data-obj="${key}"]`);
  if (el) {
    // Keep the text visually in place: move the anchor point by the width difference.
    const w = el.getBoundingClientRect().width / p.hero.getBoundingClientRect().width * 100;
    const left = pos.x - ALIGN_FRACTION[pos.align] * w;
    pos.x = round1(clamp(left + ALIGN_FRACTION[align] * w, 0, 100));
  }
  pos.align = align;
  changed({ structural: true });
  renderPanel();
}

function heroColorRows() {
  return [
    colorRow("hero-name", "Name"),
    colorRow("hero-line", "Line under the name", { hint: "Defaults to the name color." }),
    colorRow("hero-tagline", "Tagline"),
    S.content.hero.credit && colorRow("hero-credit", "Image credit"),
  ];
}

function heroPositionCard() {
  const hero = S.content.hero;
  const positions = hero.positions;
  const tip = h("div", { class: "callout" }, svg('<path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/>'),
    h("div", {}, h("b", {}, "Drag the text in the preview to move it."), " It snaps to the center and to the other text — hold ⌥ Option to move freely. Phones always use the centered layout."));

  if (!positions) {
    return h("div", { class: "card" }, h("h3", {}, "Text position"), tip,
      h("p", { style: { margin: "0 0 10px", color: "var(--ink-2)" } }, "Currently using the automatic layout."),
      h("button", { class: "btn btn--sm", onclick: customizeHero }, "Set positions manually"));
  }

  const numInput = (pos, key, lo, hi) => {
    const el = h("input", { class: "input", type: "number", min: lo, max: hi, step: "0.5" });
    el.value = pos[key];
    el.addEventListener("input", () => {
      const v = parseFloat(el.value);
      if (Number.isNaN(v)) return;
      pos[key] = clamp(v, lo, hi);
      applyHeroPositions(hero.positions);
      changed({ skipPreview: true });
    });
    return h("div", { class: "num" }, el, h("span", {}, "%"));
  };

  const rows = HERO_OBJECTS.filter(([key]) => positions[key]).map(([key, label]) => {
    const pos = positions[key];
    return [
      h("div", { class: "name" }, label),
      numInput(pos, "x", 0, 100),
      numInput(pos, "y", 0, 100),
      h("div", { class: "seg seg--align" }, ["left", "center", "right"].map((a) =>
        h("button", { class: pos.align === a ? "on" : "", title: `Align ${a}`, onclick: () => setHeroAlign(key, a) },
          a[0].toUpperCase() + a.slice(1)))),
    ];
  });

  return h("div", { class: "card" },
    h("h3", {}, "Text position"), tip,
    h("div", { class: "pos-grid" },
      h("div", { class: "head" }, ""), h("div", { class: "head" }, "Across (X)"), h("div", { class: "head" }, "Down (Y)"), h("div", { class: "head" }, "Text alignment"),
      ...rows.flat()),
    h("div", { style: { display: "flex", gap: "8px", marginTop: "14px", flexWrap: "wrap" } },
      h("button", { class: "btn btn--sm", onclick: () => {
        for (const pos of Object.values(hero.positions)) { if (pos !== hero.positions.credit) { pos.x = 50; pos.align = "center"; } }
        changed({ structural: true }); renderPanel();
      } }, "Center name & tagline"),
      h("button", { class: "btn btn--sm btn--ghost btn--danger", onclick: () => {
        delete hero.positions; changed({ structural: true }); renderPanel();
        toast("Back to the automatic layout", { action: "Undo", onAction: undo });
      } }, "Reset to automatic layout")));
}

// Drag hero text inside the preview iframe.
let heroJustDragged = false;
function enableHeroDragging(doc) {
  const hero = doc.querySelector(".hero");
  if (!hero) return;
  const guides = { x: doc.createElement("div"), y: doc.createElement("div") };
  guides.x.className = "edit-guide edit-guide--x";
  guides.y.className = "edit-guide edit-guide--y";
  hero.append(guides.x, guides.y);

  hero.querySelectorAll(".hero__obj").forEach((el) => {
    el.dataset.edit = "";
    el.title = "Drag to move · click to edit";
    el.addEventListener("click", (e) => {
      e.preventDefault(); e.stopPropagation();
      if (!heroJustDragged) showPanel("hero");
    });
    el.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      if ($("#stage").classList.contains("mobile")) {
        toast("Switch the preview to Desktop to move text — phones use the centered layout.");
        return;
      }
      e.preventDefault();
      const key = el.dataset.obj;
      const startX = e.clientX, startY = e.clientY;
      let positions = null, start, box;
      try { el.setPointerCapture(e.pointerId); } catch {}

      const onMove = (ev) => {
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (!positions) {
          if (Math.hypot(dx, dy) < 4) return;
          positions = measureHero();
          if (!positions?.[key]) return;
          applyHeroPositions(positions);
          box = hero.getBoundingClientRect();
          start = { ...positions[key] };
          el.classList.add("edit-dragging");
          doc.body.style.userSelect = "none";
        }
        let x = start.x + dx / box.width * 100;
        let y = start.y + dy / box.height * 100;
        let snapX = null, snapY = null;
        if (!ev.altKey) {
          const tolX = 8 / box.width * 100, tolY = 8 / box.height * 100;
          const xTargets = [50, ...Object.entries(positions).filter(([k]) => k !== key).map(([, p]) => p.x)];
          for (const t of xTargets) if (Math.abs(x - t) < tolX) { x = t; snapX = t; break; }
          if (Math.abs(y - 50) < tolY) { y = 50; snapY = 50; }
        }
        positions[key].x = round1(clamp(x, 0, 100));
        positions[key].y = round1(clamp(y, 9, 99));
        applyHeroPositions(positions);
        guides.x.style.left = snapX + "%"; guides.x.hidden = snapX === null;
        guides.y.style.top = snapY + "%"; guides.y.hidden = snapY === null;
      };
      const onUp = () => {
        doc.removeEventListener("pointermove", onMove);
        doc.removeEventListener("pointerup", onUp);
        doc.removeEventListener("pointercancel", onUp);
        guides.x.hidden = guides.y.hidden = true;
        el.classList.remove("edit-dragging");
        doc.body.style.userSelect = "";
        if (!positions) return;
        S.content.hero.positions = positions;
        heroJustDragged = true;
        setTimeout(() => { heroJustDragged = false; }, 50);
        changed({ structural: true, skipPreview: true });
        if (S.panel !== "hero") { S.panel = "hero"; localStorage.setItem("editor.panel", "hero"); renderSidebar(); }
        renderPanel();
      };
      doc.addEventListener("pointermove", onMove);
      doc.addEventListener("pointerup", onUp);
      doc.addEventListener("pointercancel", onUp);
    });
  });
  guides.x.hidden = guides.y.hidden = true;
}

/* =====================================================================
   Live preview
   ===================================================================== */
const frame = $("#frame");
let previewSeq = 0, pendingScroll = null;

function schedulePreview(delay = 350) {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(refreshPreview, delay);
}

async function refreshPreview() {
  const seq = ++previewSeq;
  try {
    const html = await api("/api/render", { method: "POST", body: { content: S.content, page: S.previewPage } });
    if (seq !== previewSeq) return;
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    if (pendingScroll == null && win && doc?.body) {
      const track = doc.querySelector(".carousel__track");
      pendingScroll = { y: win.scrollY, x: track ? track.scrollLeft : 0 };
    }
    frame.srcdoc = html;
  } catch (e) {
    toast("Preview error: " + e.message, { error: true });
  }
}

frame.addEventListener("load", () => {
  const doc = frame.contentDocument, win = frame.contentWindow;
  if (!doc?.body) return;
  doc.head.append(Object.assign(doc.createElement("style"), { textContent: `
    html { scroll-behavior: auto !important; }
    [data-edit] { cursor: pointer; }
    [data-edit]:hover { outline: 2px dashed #40b0bf; outline-offset: -2px; }
    .news-card[data-edit]:hover { outline-offset: 2px; }
    .hero__obj[data-edit] { cursor: move; touch-action: none; }
    .hero__obj.edit-dragging { outline: 2px solid #40b0bf !important; }
    .edit-guide { position: absolute; z-index: 5; pointer-events: none; }
    .edit-guide--x { top: 0; bottom: 0; width: 0; border-left: 1px dashed #40b0bf; }
    .edit-guide--y { left: 0; right: 0; height: 0; border-top: 1px dashed #40b0bf; }
    .edit-flash { outline: 3px solid #40b0bf !important; outline-offset: 2px; transition: outline-color .6s; }` }));

  // Stop the carousel from auto-advancing while editing.
  const carousel = doc.querySelector("[data-carousel]");
  carousel?.dispatchEvent(new Event("mouseenter"));

  // Map preview regions to editor panels.
  const mark = (sel, fn) => doc.querySelectorAll(sel).forEach((el) => { el.dataset.edit = ""; el.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); fn(el); }); });
  const visible = S.content.news.items.map((it, i) => [it, i]).filter(([it]) => !it.hidden).map(([, i]) => i);
  mark(".news-card", (el) => {
    const idx = visible[[...el.parentElement.children].indexOf(el)];
    S.panel = "news"; S.openItem = idx; S.filter = ""; renderAll();
    requestAnimationFrame(() => $(".item.open")?.scrollIntoView({ block: "nearest", behavior: "smooth" }));
  });
  mark(".news .section-title", () => showPanel("news"));
  mark(".about__text, .about__photo", () => showPanel("about"));
  mark(".contact-card, .contact .section-title", () => showPanel("contact"));
  enableHeroDragging(doc);
  mark(".nav__links > li > a, .nav__submenu a, .nav__social a, .nav__brand", () => showPanel("menu"));
  mark(".coming-soon > div", () => showPanel("pages"));
  doc.addEventListener("click", (e) => { if (e.target.closest("a")) e.preventDefault(); }, true);

  if (pendingScroll) {
    win.scrollTo(0, pendingScroll.y);
    const track = doc.querySelector(".carousel__track");
    if (track) { track.style.scrollBehavior = "auto"; track.scrollLeft = pendingScroll.x; track.style.scrollBehavior = ""; }
    pendingScroll = null;
  }
});

function scrollPreviewTo(anchor) {
  const doc = frame.contentDocument;
  if (!doc?.body) return;
  if (!anchor) return frame.contentWindow.scrollTo({ top: 0, behavior: "smooth" });
  const el = doc.getElementById(anchor);
  if (el) frame.contentWindow.scrollTo({ top: el.getBoundingClientRect().top + frame.contentWindow.scrollY - 80, behavior: "smooth" });
}

function focusPreviewCard(index) {
  const doc = frame.contentDocument;
  if (!doc?.body || S.content.news.items[index]?.hidden) return;
  const pos = S.content.news.items.slice(0, index).filter((it) => !it.hidden).length;
  const card = doc.querySelectorAll(".news-card")[pos];
  if (!card) return;
  scrollPreviewTo("news-title");
  const track = card.parentElement;
  track.scrollTo({ left: card.offsetLeft - track.offsetLeft, behavior: "smooth" });
  card.classList.add("edit-flash");
  setTimeout(() => card.classList.remove("edit-flash"), 1200);
}

function setPreviewPage(file) {
  S.previewPage = file;
  $("#previewPage").value = file;
  pendingScroll = { y: 0, x: 0 };
  schedulePreview(0);
}

// Desktop preview renders at a real laptop width and is scaled to fit the pane;
// mobile renders at phone width inside a frame.
const DESKTOP_W = 1280, MOBILE_W = 390;
function layoutPreview() {
  const stage = $("#stage");
  const W = stage.clientWidth, H = stage.clientHeight;
  if (!W || !H) return;
  if (stage.classList.contains("mobile")) {
    const scale = Math.min(1, (H - 40) / 800);
    Object.assign(frame.style, { width: MOBILE_W + "px", height: (H - 40) / scale + "px",
      transform: `scale(${scale})`, left: (W - MOBILE_W * scale) / 2 + "px", top: "20px" });
  } else {
    const scale = Math.min(1, W / DESKTOP_W);
    Object.assign(frame.style, { width: W / scale + "px", height: H / scale + "px",
      transform: `scale(${scale})`, left: "0", top: "0" });
  }
}
new ResizeObserver(layoutPreview).observe($("#stage"));

$("#previewPage").addEventListener("change", (e) => setPreviewPage(e.target.value));
document.querySelectorAll("[data-device]").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll("[data-device]").forEach((x) => x.classList.toggle("on", x === b));
  $("#stage").classList.toggle("mobile", b.dataset.device === "mobile");
  layoutPreview();
}));
$("#togglePreview").addEventListener("click", () => {
  const layout = $("#layout");
  if (matchMedia("(max-width: 1100px)").matches) layout.classList.toggle("show-preview");
  else layout.classList.toggle("no-preview");
});
setTimeout(() => $("#tip").remove(), 6000);

/* =====================================================================
   Publish
   ===================================================================== */
async function openPublish() {
  if (isDirty()) await save();
  if (isDirty()) return;
  let status;
  try { status = await api("/api/git-status"); }
  catch (e) { return toast("Couldn't read git status: " + e.message, { error: true }); }
  if (!status.available) return toast("This folder isn't a git repository, so it can't be published from here.", { error: true, ms: 7000 });

  const close = () => back.remove();
  const msg = h("input", { class: "input", value: "Update website" });
  const log = h("pre", { class: "log", hidden: true });
  const go = h("button", { class: "btn btn--primary", disabled: !status.changes.length }, svg(ICON.upload), "Publish now");
  go.addEventListener("click", async () => {
    go.disabled = true; go.textContent = "Publishing…";
    try {
      const res = await api("/api/publish", { method: "POST", body: { message: msg.value } });
      log.hidden = false; log.textContent = res.log;
      if (res.ok) { go.textContent = "Published"; toast("Published! The live site updates in a minute or two.", { ms: 6000 }); }
      else { go.textContent = "Failed — see log"; }
    } catch (e) { log.hidden = false; log.textContent = e.message; go.textContent = "Failed"; }
  });
  const back = h("div", { class: "modal-back", onclick: (e) => e.target === back && close() },
    h("div", { class: "modal" },
      h("header", {}, h("h2", {}, "Publish to the live website")),
      h("div", { class: "content" },
        h("p", { style: { marginTop: 0, color: "var(--ink-2)" } },
          "This commits your saved changes and pushes them to GitHub (", h("code", {}, status.branch), " → ", h("code", {}, status.remote), "). GitHub Pages then updates the public site."),
        status.changes.length
          ? [h("div", { class: "label", style: { fontWeight: 500, fontSize: "13px" } }, `${status.changes.length} changed file(s):`), h("div", { class: "changes" }, status.changes.join("\n").split("\n").map((l) => h("div", {}, l)))]
          : h("p", { class: "empty", style: { padding: "12px" } }, "Nothing new to publish — everything is already live."),
        field("Short description of the change", msg),
        log),
      h("footer", {}, h("button", { class: "btn", onclick: close }, "Close"), go)));
  document.body.append(back);
  msg.select();
}

/* =====================================================================
   Wiring
   ===================================================================== */
$("#save").addEventListener("click", save);
$("#discard").addEventListener("click", discard);
$("#undo").addEventListener("click", undo);
$("#redo").addEventListener("click", redo);
$("#publish").addEventListener("click", openPublish);

document.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); save(); return; }
  if (e.key === "Escape") document.querySelector(".modal-back")?.remove();
  const editing = e.target.closest("input, textarea, [contenteditable]");
  if (mod && e.key.toLowerCase() === "z" && !editing) {
    e.preventDefault();
    e.shiftKey ? redo() : undo();
  }
});

window.addEventListener("beforeunload", (e) => { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });

(async function init() {
  try {
    [S.content, META] = await Promise.all([api("/api/content"), api("/api/meta")]);
    S.content.theme ??= {};
  } catch (e) {
    $("#editor").replaceChildren(h("div", { class: "empty" }, "Couldn't load content: " + e.message,
      h("br"), "Start the editor with: python3 _editor/editor.py"));
    return;
  }
  S.savedJSON = S.lastSnapshot = JSON.stringify(S.content);
  if (!Panels[S.panel]) S.panel = "news";
  $("#previewPage").replaceChildren(
    h("option", { value: "index.html" }, "Home"),
    ...S.content.pages.map((p) => h("option", { value: p.file }, p.title)));
  renderAll();
  refreshPreview();
})();
</script>
